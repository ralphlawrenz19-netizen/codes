<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Animated Letter</title>
    <style>
        /* ============================================
           RESET & TYPOGRAPHY
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Georgia', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #09090B;
            color: #E0E0E0;
        }

        /* ============================================
           BACKGROUND LAYERS
           ============================================ */
        
        /* Main background container */
        .bg-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #09090B;
            overflow: hidden;
            z-index: 1;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                #0a0e27 0%,
                #1a0d2e 25%,
                #0d1b2a 50%,
                #1a0d1e 75%,
                #09090B 100%
            );
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { filter: brightness(1) saturate(1); }
            50% { filter: brightness(1.05) saturate(1.1); }
        }

        /* Glowing orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float-slow 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #7c3aed, transparent);
            top: -100px;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #3b82f6, transparent);
            bottom: -50px;
            right: 5%;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ec4899, transparent);
            top: 40%;
            right: -50px;
            animation-delay: 10s;
        }

        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(30px) translateX(20px); }
        }

        /* Particle canvas for stars and dust */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        /* Vignette effect */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* ============================================
           MAIN CONTAINER & ENVELOPE
           ============================================ */

        .scene-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            perspective: 1200px;
        }

        /* Envelope wrapper */
        .envelope {
            width: 420px;
            height: 280px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 8px;
            box-shadow: 
                0 0 40px rgba(124, 58, 237, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: envelopeFloat 3s ease-in-out infinite;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        @keyframes envelopeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .envelope:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 0 60px rgba(124, 58, 237, 0.4),
                0 30px 80px rgba(0, 0, 0, 0.8);
        }

        /* Envelope flap */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border-radius: 8px 8px 0 0;
            transform-origin: top center;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border: 1px solid rgba(124, 58, 237, 0.1);
        }

        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
        }

        /* Envelope flap triangle */
        .envelope-flap::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 60px solid #1a1a2e;
        }

        /* Seal/heart */
        .seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899, #7c3aed);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            z-index: 10;
            transition: all 0.3s ease;
            animation: sealPulse 2s ease-in-out infinite;
        }

        @keyframes sealPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .envelope.open .seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        /* ============================================
           LETTER (OPENED STATE)
           ============================================ */

        .letter-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease 0.3s;
        }

        .letter-wrapper.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .letter {
            width: min(90vw, 700px);
            height: min(90vh, 800px);
            background: linear-gradient(135deg, #1a1628 0%, #2d1b3d 100%);
            border-radius: 16px;
            box-shadow: 
                0 0 60px rgba(124, 58, 237, 0.3),
                0 30px 100px rgba(0, 0, 0, 0.8),
                inset 0 1px 20px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(124, 58, 237, 0.2);
            padding: 60px 50px;
            position: relative;
            animation: letterEntry 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes letterEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Letter decorative border */
        .letter::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 2px solid;
            border-image: linear-gradient(135deg, #ec4899 0%, #3b82f6 50%, #7c3aed 100%) 1;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Letter header decoration */
        .letter-header {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, 
                rgba(124, 58, 237, 0.1) 0%,
                rgba(124, 58, 237, 0.05) 50%,
                transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        /* Floating hearts in letter */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: heartFloat 4s ease-in forwards;
        }

        @keyframes heartFloat {
            0% {
                opacity: 0.7;
                transform: translateY(0) translateX(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) translateX(20px) scale(0.5);
            }
        }

        /* Letter content */
        .letter-content {
            position: relative;
            z-index: 5;
            font-size: 18px;
            line-height: 1.8;
            color: #E0E0E0;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-right: 10px;
        }

        .letter-content::-webkit-scrollbar {
            width: 8px;
        }

        .letter-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .letter-content::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.3);
            border-radius: 4px;
        }

        .letter-content::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.5);
        }

        /* Paragraph animation */
        .paragraph {
            margin-bottom: 20px;
            opacity: 0;
            animation: paragraphReveal 0.8s ease forwards;
        }

        .paragraph:nth-child(1) { animation-delay: 1.2s; }
        .paragraph:nth-child(2) { animation-delay: 1.8s; }
        .paragraph:nth-child(3) { animation-delay: 2.4s; }
        .paragraph:nth-child(4) { animation-delay: 3s; }
        .paragraph:nth-child(5) { animation-delay: 3.6s; }
        .paragraph:nth-child(6) { animation-delay: 4.2s; }

        @keyframes paragraphReveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typewriter text */
        .typewriter-text {
            display: inline;
            border-right: 2px solid #7c3aed;
            animation: typewriterCursor 0.7s infinite;
        }

        @keyframes typewriterCursor {
            0%, 49%, 100% { border-right-color: #7c3aed; }
            50%, 99% { border-right-color: transparent; }
        }

        /* ============================================
           CONTROLS & BUTTONS
           ============================================ */

        /* Top controls */
        .controls-top {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        /* Bottom controls */
        .controls-bottom {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Button style */
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(59, 130, 246, 0.3));
            border: 1px solid rgba(124, 58, 237, 0.5);
            border-radius: 8px;
            color: #E0E0E0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(59, 130, 246, 0.5));
            box-shadow: 
                0 0 20px rgba(124, 58, 237, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Music button glow when playing */
        button.playing {
            animation: buttonGlow 1s ease-in-out infinite;
        }

        @keyframes buttonGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 10px rgba(124, 58, 237, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 
                    0 0 30px rgba(124, 58, 237, 0.8),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
        }

        /* ============================================
           MODAL/OVERLAY
           ============================================ */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 30;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */

        @media (max-width: 768px) {
            .envelope {
                width: 320px;
                height: 220px;
            }

            .letter {
                padding: 40px 30px;
                font-size: 16px;
            }

            .controls-top {
                top: 15px;
                right: 15px;
                gap: 8px;
            }

            button {
                padding: 10px 18px;
                font-size: 12px;
            }

            .controls-bottom {
                bottom: 15px;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .envelope {
                width: 280px;
                height: 190px;
            }

            .letter {
                width: min(95vw, 600px);
                height: min(95vh, 700px);
                padding: 30px 20px;
                font-size: 14px;
            }

            .controls-top {
                top: 10px;
                right: 10px;
                flex-wrap: wrap;
            }

            button {
                padding: 8px 14px;
                font-size: 11px;
            }
        }

        /* ============================================
           HIDDEN STATE (before opening)
           ============================================ */

        .letter-wrapper:not(.visible) {
            display: none;
        }

        /* ============================================
           SPECIAL EFFECTS
           ============================================ */

        /* Cursor trail particles */
        .cursor-particle {
            position: fixed;
            pointer-events: none;
            font-size: 12px;
            opacity: 0;
            animation: particleFloat 1s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }
    </style>
</head>
<body>
    <!-- ========================================
         BACKGROUND LAYERS
         ======================================== -->
    
    <div class="bg-container">
        <!-- Animated gradient -->
        <div class="gradient-bg"></div>

        <!-- Glowing orbs -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>

        <!-- Particle canvas for stars and dust -->
        <canvas id="particleCanvas"></canvas>

        <!-- Vignette effect -->
        <div class="vignette"></div>
    </div>

    <!-- ========================================
         ENVELOPE
         ======================================== -->
    
    <div class="scene-container">
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="seal">❤</div>
        </div>
    </div>

    <!-- ========================================
         LETTER (OPENED STATE)
         ======================================== -->
    
    <div class="letter-wrapper" id="letterWrapper">
        <div class="letter" id="letter">
            <div class="letter-header"></div>
            <div class="letter-content" id="letterContent">
                <!-- Content populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- ========================================
         OVERLAY
         ======================================== -->
    
    <div class="overlay" id="overlay"></div>

    <!-- ========================================
         CONTROLS
         ======================================== -->
    
    <!-- Top controls -->
    <div class="controls-top">
        <button id="musicBtn">🎵 Play Music</button>
        <button id="muteBtn">🔊 Mute</button>
    </div>

    <!-- Bottom controls -->
    <div class="controls-bottom">
        <button id="replayBtn">↻ Replay Animation</button>
        <button id="downloadBtn">⬇ Download PDF</button>
        <button id="closeBtn">✕ Close</button>
    </div>

    <!-- ========================================
         JAVASCRIPT
         ======================================== -->
    
    <script>
        // ========================================
        // CONFIGURATION
        // ========================================
        
        const CONFIG = {
            letterContent: `Dear Treasure,

I've been thinking about how to write this for the longest time. Words never seem enough to capture what I feel, but I'm going to try anyway because you deserve to know.

Every moment with you feels like stepping into a dream. Your laugh echoes in my mind long after we've said goodbye. The way you light up when you talk about things you love—it makes my heart skip a beat.

I find myself wanting to know everything about you. Not just the big things, but the small details too. How you take your coffee. Your favorite kind of silence. The way you look when you're lost in thought.

I'm writing this in the quiet of the night, under a sky full of stars, and all I can think about is how lucky I feel that you exist in this world. That somehow, against all odds, our paths crossed.

I don't know what the future holds, but I know I want you in it. I'm terrified and hopeful all at once. This letter is my way of saying that you matter to me. More than words could ever express.

Thank you for being you. Thank you for letting me into your world.

Forever yours,
Someone who cares more than they probably should`,

            audioFrequencies: {
                base: 220,    // A3
                harmonic: 277.18, // C#4
                filterFreq: 800
            }
        };

        // ========================================
        // DOM ELEMENTS
        // ========================================
        
        const envelope = document.getElementById('envelope');
        const letterWrapper = document.getElementById('letterWrapper');
        const letterContent = document.getElementById('letterContent');
        const musicBtn = document.getElementById('musicBtn');
        const muteBtn = document.getElementById('muteBtn');
        const replayBtn = document.getElementById('replayBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const closeBtn = document.getElementById('closeBtn');
        const overlay = document.getElementById('overlay');
        const particleCanvas = document.getElementById('particleCanvas');

        // ========================================
        // STATE
        // ========================================
        
        let isLetterOpen = false;
        let isMusicPlaying = false;
        let isAudioMuted = false;
        let audioContext = null;
        let masterGain = null;

        // ========================================
        // PARTICLE SYSTEM (Background)
        // ========================================
        
        const ctx = particleCanvas.getContext('2d');
        const particles = [];
        const stars = [];

        function resizeCanvas() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Create stars
        function createStars() {
            stars.length = 0;
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random() * 0.5 + 0.3,
                    twinkleSpeed: Math.random() * 0.02 + 0.01
                });
            }
        }

        createStars();

        // Create floating dust/particles
        function createFloatingParticle() {
            particles.push({
                x: Math.random() * particleCanvas.width,
                y: Math.random() * particleCanvas.height,
                size: Math.random() * 2 + 0.5,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                opacity: Math.random() * 0.3 + 0.1,
                life: 1,
                color: ['rgba(124, 58, 237,', 'rgba(59, 130, 246,', 'rgba(236, 72, 153,'][
                    Math.floor(Math.random() * 3)
                ]
            });
        }

        // Initialize some particles
        for (let i = 0; i < 30; i++) {
            createFloatingParticle();
        }

        // Animate particles
        function animateParticles() {
            // Clear canvas
            ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

            // Draw and update stars (twinkling)
            stars.forEach(star => {
                star.opacity += (Math.random() - 0.5) * star.twinkleSpeed;
                star.opacity = Math.max(0.2, Math.min(0.8, star.opacity));

                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw and update particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.01; // Gentle gravity
                p.opacity -= 0.003;

                if (p.opacity <= 0) {
                    particles.splice(idx, 1);
                    createFloatingParticle();
                } else {
                    ctx.fillStyle = `${p.color} ${p.opacity})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        // ========================================
        // ENVELOPE INTERACTION
        // ========================================
        
        envelope.addEventListener('click', openLetter);

        function openLetter() {
            if (isLetterOpen) return;
            
            isLetterOpen = true;
            envelope.classList.add('open');
            overlay.classList.add('active');
            letterWrapper.classList.add('visible');

            // Populate letter content with typewriter effect
            populateLetterContent();

            // Create floating hearts
            createFloatingHearts();
        }

        // ========================================
        // LETTER CONTENT & TYPEWRITER
        // ========================================
        
        function populateLetterContent() {
            letterContent.innerHTML = '';
            const paragraphs = CONFIG.letterContent.split('\n\n');

            paragraphs.forEach((para, idx) => {
                const p = document.createElement('p');
                p.className = 'paragraph';
                p.style.opacity = '0';

                // Add paragraph with typewriter effect
                const span = document.createElement('span');
                span.className = 'typewriter-text';
                p.appendChild(span);

                letterContent.appendChild(p);

                // Typewriter animation
                setTimeout(() => {
                    p.style.opacity = '1';
                    typewriteParagraph(span, para, idx);
                }, 600 + idx * 600);
            });
        }

        function typewriteParagraph(element, text, index) {
            let charIndex = 0;

            function type() {
                if (charIndex < text.length) {
                    element.textContent += text[charIndex];
                    charIndex++;
                    setTimeout(type, 30 + Math.random() * 20);
                } else {
                    // Remove cursor
                    element.classList.remove('typewriter-text');
                }
            }

            type();
        }

        // ========================================
        // FLOATING HEARTS
        // ========================================
        
        function createFloatingHearts() {
            const letterRect = document.getElementById('letter').getBoundingClientRect();
            const hearts = ['❤', '💜', '💙', '🤍'];

            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    
                    const startX = letterRect.left + Math.random() * letterRect.width;
                    const startY = letterRect.top + Math.random() * letterRect.height;

                    heart.style.left = startX + 'px';
                    heart.style.top = startY + 'px';
                    heart.style.fontSize = (16 + Math.random() * 16) + 'px';

                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4000);
                }, i * 200);
            }
        }

        // ========================================
        // BUTTON CONTROLS
        // ========================================
        
        replayBtn.addEventListener('click', replayAnimation);
        downloadBtn.addEventListener('click', downloadPDF);
        closeBtn.addEventListener('click', closeLetter);
        musicBtn.addEventListener('click', toggleMusic);
        muteBtn.addEventListener('click', toggleMute);

        function replayAnimation() {
            if (!isLetterOpen) return;
            
            // Reset letter content
            letterContent.innerHTML = '';
            populateLetterContent();
            createFloatingHearts();

            // Scroll to top
            letterContent.scrollTop = 0;
        }

        function downloadPDF() {
            if (!isLetterOpen) return;
            
            // Use browser's print dialog (can save as PDF)
            window.print();
        }

        function closeLetter() {
            isLetterOpen = false;
            envelope.classList.remove('open');
            overlay.classList.remove('active');
            letterWrapper.classList.remove('visible');
        }

        // ========================================
        // AUDIO SYSTEM
        // ========================================
        
        function initAudio() {
            if (audioContext) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();

            // Create master gain
            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.05;
            masterGain.connect(audioContext.destination);

            // Create oscillators
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            
            osc1.type = 'sine';
            osc2.type = 'sine';
            
            osc1.frequency.value = CONFIG.audioFrequencies.base;
            osc2.frequency.value = CONFIG.audioFrequencies.harmonic;

            // Create gains for oscillators
            const gain1 = audioContext.createGain();
            const gain2 = audioContext.createGain();
            
            gain1.gain.value = 0.4;
            gain2.gain.value = 0.3;

            // Create low-pass filter
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = CONFIG.audioFrequencies.filterFreq;
            filter.Q.value = 0.9;

            // Create LFO for modulation
            const lfo = audioContext.createOscillator();
            lfo.frequency.value = 0.15;
            
            const lfoGain = audioContext.createGain();
            lfoGain.gain.value = 8;

            // Connect everything
            osc1.connect(gain1);
            osc2.connect(gain2);
            gain1.connect(filter);
            gain2.connect(filter);
            filter.connect(masterGain);

            lfo.connect(lfoGain);
            lfoGain.connect(osc1.frequency);
            lfoGain.connect(osc2.frequency);

            // Start oscillators
            osc1.start();
            osc2.start();
            lfo.start();
        }

        function toggleMusic() {
            if (!audioContext) {
                initAudio();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }

            isMusicPlaying = !isMusicPlaying;

            if (isMusicPlaying) {
                masterGain.gain.linearRampToValueAtTime(0.05, audioContext.currentTime + 0.5);
                musicBtn.classList.add('playing');
                musicBtn.textContent = '🎵 Stop Music';
            } else {
                masterGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.5);
                musicBtn.classList.remove('playing');
                musicBtn.textContent = '🎵 Play Music';
            }
        }

        function toggleMute() {
            if (!audioContext) return;

            isAudioMuted = !isAudioMuted;
            
            if (isAudioMuted) {
                masterGain.gain.value = 0;
                muteBtn.textContent = '🔇 Unmute';
            } else {
                masterGain.gain.value = isMusicPlaying ? 0.05 : 0;
                muteBtn.textContent = '🔊 Mute';
            }
        }

        // ========================================
        // CURSOR PARTICLES
        // ========================================
        
        document.addEventListener('mousemove', (e) => {
            // Create occasional particles at cursor
            if (Math.random() > 0.85) {
                const particle = document.createElement('div');
                particle.className = 'cursor-particle';
                particle.textContent = '✨';
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 40 + 'px');
                particle.style.setProperty('--ty', -40 + Math.random() * 20 + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1000);
            }
        });

        // ========================================
        // RESPONSIVE ADJUSTMENTS
        // ========================================
        
        window.addEventListener('resize', () => {
            // Adjust letter size if needed
            const letter = document.getElementById('letter');
            if (letter) {
                // Letter responsiveness is handled by CSS media queries
            }
        });

        // ========================================
        // KEYBOARD SHORTCUTS
        // ========================================
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLetter();
            }
            if (e.key === 'm' && isLetterOpen) {
                toggleMusic();
            }
        });

        // ========================================
        // INITIALIZATION
        // ========================================
        
        console.log('💌 Premium Letter Experience Loaded');
    </script>
